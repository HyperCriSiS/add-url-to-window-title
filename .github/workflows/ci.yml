name: Extension validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Source syntax
        run: |
          node --check title-core.js
          node --check navigation-hook.js
          node --check managetitle.js
          node --check options.js
          node --check tests/e2e/chromium.mjs
          python3 -m py_compile tests/e2e/firefox.py

      - name: Unit tests
        run: node --test tests/*.test.js

      - name: Manifest and locale JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8'))"
          for file in _locales/*/messages.json; do node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$file"; done

      - name: Mozilla web-ext lint
        run: npx --yes web-ext@10.5.0 lint --source-dir . --warnings-as-errors

      - name: Build extension package
        run: npx --yes web-ext@10.5.0 build --source-dir . --artifacts-dir web-ext-artifacts --overwrite-dest

      - name: Validate package contents
        shell: bash
        run: |
          set -euo pipefail
          package="$(find web-ext-artifacts -maxdepth 1 -name '*.zip' -print -quit)"
          test -n "$package"
          echo "Package: $package"
          unzip -l "$package"
          unzip -p "$package" manifest.json | node -e "let d=''; process.stdin.on('data', c => d += c).on('end', () => JSON.parse(d));"
          if unzip -Z1 "$package" | grep -E '^(tests/?|README\.md$|Roadmap\.md$|CONTRIBUTING\.md$|web-ext-config\.mjs$|\.github/)'; then
            echo 'Development-only files leaked into the extension package.' >&2
            exit 1
          fi

      - name: Upload validated extension package
        uses: actions/upload-artifact@v7
        with:
          name: extension-package
          path: web-ext-artifacts/*.zip
          if-no-files-found: error

  chromium-e2e:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install pinned Playwright test runtime
        run: |
          npm init -y >/dev/null
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps --no-shell chromium

      - name: Run Chromium extension E2E tests
        run: node tests/e2e/chromium.mjs

  firefox-e2e:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install current Firefox
        id: firefox
        uses: browser-actions/setup-firefox@v1.7.2
        with:
          firefox-version: latest

      - name: Download validated extension package
        uses: actions/download-artifact@v8.0.1
        with:
          name: extension-package
          path: web-ext-artifacts

      - name: Install pinned geckodriver
        uses: browser-actions/setup-geckodriver@bf8266f624ca122cedb6d0381a031f18f6c431cd
        with:
          geckodriver-version: 0.37.1
          token: ${{ github.token }}

      - name: Verify geckodriver
        run: geckodriver --version

      - name: Install pinned Selenium runtime
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check selenium==4.46.0

      - name: Run Firefox temporary-install E2E tests
        env:
          FIREFOX_PATH: ${{ steps.firefox.outputs.firefox-path }}
        shell: bash
        run: |
          set -euo pipefail
          package="$(find web-ext-artifacts -maxdepth 1 -name '*.zip' -print -quit)"
          test -n "$package"
          cp "$package" /tmp/add-url-to-window-title.xpi
          "$FIREFOX_PATH" --version
          .venv/bin/python tests/e2e/firefox.py /tmp/add-url-to-window-title.xpi

  waterfox-e2e:
    needs: validate
    runs-on: ubuntu-latest
    env:
      WATERFOX_VERSION: 6.6.17
      WATERFOX_SHA512: 580e88f93995e315eb8d514c596b3f55f047451a630ece854ed1a6b9c9d787465ef8bc20475f9f9c36a6b71f1b8fafbd8929fe3b25af433b44ef8e8365fe9c6f
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download validated extension package
        uses: actions/download-artifact@v8.0.1
        with:
          name: extension-package
          path: web-ext-artifacts

      - name: Download and verify Waterfox stable
        shell: bash
        run: |
          set -euo pipefail
          archive="waterfox-${WATERFOX_VERSION}.tar.bz2"
          url="https://cdn.waterfox.com/waterfox/releases/${WATERFOX_VERSION}/Linux_x86_64/${archive}"
          curl --fail --location --retry 3 --output "$archive" "$url"
          echo "${WATERFOX_SHA512}  ${archive}" | sha512sum --check --strict
          tar -xjf "$archive"
          ./waterfox/waterfox --version

      - name: Install pinned geckodriver
        uses: browser-actions/setup-geckodriver@bf8266f624ca122cedb6d0381a031f18f6c431cd
        with:
          geckodriver-version: 0.37.1
          token: ${{ github.token }}

      - name: Verify geckodriver
        run: geckodriver --version

      - name: Install pinned Selenium runtime
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check selenium==4.46.0

      - name: Run Waterfox temporary-install E2E tests
        env:
          FIREFOX_PATH: ${{ github.workspace }}/waterfox/waterfox
        shell: bash
        run: |
          set -euo pipefail
          package="$(find web-ext-artifacts -maxdepth 1 -name '*.zip' -print -quit)"
          test -n "$package"
          cp "$package" /tmp/add-url-to-window-title.xpi
          "$FIREFOX_PATH" --version
          .venv/bin/python tests/e2e/firefox.py /tmp/add-url-to-window-title.xpi
